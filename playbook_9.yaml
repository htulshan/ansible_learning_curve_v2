- name: testing printing outputs of config change
  hosts: cisco_routers

  tasks:
    - name: config change
      ios_config:
        parents:
          - line vty 0 4
        lines:
          - exec-timeout 0 0
        save_when: modified
        backup: yes
      register: cfg

    - name: show changes
      debug: 
        var: cfg.updates
      when: cfg.changed
